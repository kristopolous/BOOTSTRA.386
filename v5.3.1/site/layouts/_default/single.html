{{ define "main" }}
  <main class="bd-content" id="content">
    <div class="container-fluid bd-gutter bd-page">
      <h1 class="bd-title">{{ .Title | markdownify }}</h1>
      {{ with .Page.Params.Description }}<p class="lead bd-lead">{{ . | markdownify }}</p>{{ end }}
      {{ if eq .Title "Examples" }}
      <p>
        <a href="{{ .Site.Params.download.dist_examples }}" class="btn">Download examples</a>
        <a href="{{ .Site.Params.download.source }}" class="btn">Download source code</a>
      </p>
      {{ end }}

      {{ .Content }}
    </div>
  </main>
{{ end }}
