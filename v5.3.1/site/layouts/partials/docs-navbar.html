<header class="navbar navbar-expand bd-navbar fixed-top">
  <nav class="container-fluid bd-gutter" aria-label="Main navigation">
    <a class="navbar-brand" href="/" aria-label="BOOTSTRA/386">BOOTSTRA/386 v{{ .Site.Params.docs_version }}</a>

    <ul class="navbar-nav bd-navbar-nav">
      <li class="nav-item">
        <a class="nav-link{{ if .IsHome }} active" aria-current="true{{ end }}" href="/">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link{{ if eq .Page.Layout "docs" }} active" aria-current="true{{ end }}" href="/docs/{{ .Site.Params.docs_version }}/getting-started/introduction/">Docs</a>
      </li>
      <li class="nav-item">
        <a class="nav-link{{ if eq .Page.Title "Examples" }} active" aria-current="true{{ end }}" href="/docs/{{ .Site.Params.docs_version }}/examples/">Examples</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ .Site.Params.icons }}" target="_blank" rel="noopener">Icons</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ .Site.Params.themes }}" target="_blank" rel="noopener">Themes</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ .Site.Params.blog }}" target="_blank" rel="noopener">Blog</a>
      </li>
    </ul>

    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" href="{{ .Site.Params.repo }}" target="_blank" rel="noopener">GitHub</a>
      </li>

      {{ partial "docs-versions" . }}

      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" id="bd-theme" role="button" aria-expanded="false" data-bs-toggle="dropdown" data-bs-display="static" aria-label="Toggle screen (blue)">
          <span id="bd-theme-text">Screen</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme-text">
          <li><button type="button" class="dropdown-item" data-bs-theme-value="light" aria-pressed="false">Blue</button></li>
          <li><button type="button" class="dropdown-item" data-bs-theme-value="dark" aria-pressed="false">Black</button></li>
          <li><button type="button" class="dropdown-item active" data-bs-theme-value="auto" aria-pressed="true">Auto</button></li>
        </ul>
      </li>
    </ul>
  </nav>
